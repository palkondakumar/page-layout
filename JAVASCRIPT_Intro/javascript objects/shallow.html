        // shallowcopy

        const person = {
            name: "Murali",
            address: {
                city: "Bangalore"
            }
        };

        const copyperson = { ...person }
        console.log(person);

        copyperson.address.city = "Hyderabad";
        console.log(copyperson.address.city);

        //   deep copy

        const deepCopy = JSON.parse(JSON.stringify(person));

        deepCopy.address.city = "Chennai";
        console.log(deepCopy.address.city);
    </script>
