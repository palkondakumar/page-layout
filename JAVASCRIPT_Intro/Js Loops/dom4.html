<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .success {
            background: green;
            color: white;
        }
    </style>


</head>

<body>
    <h1>helooooo</h1>
    <p id="div"></p>


    <script>

        document.querySelector("#div").style.height = "200px";
        document.querySelector("#div").style.width = "200px";
        document.querySelector("#div").style.border = "2px solid";
        document.querySelector("#div").style.background = "red";


        // working with attributes


        document.querySelector("h1").setAttribute(
            "class",
            "success"
        )


    </script>
</body>

</html>
