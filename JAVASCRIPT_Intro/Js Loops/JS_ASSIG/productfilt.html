<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Filter</title>
    <link rel="stylesheet" href="productfilt.css">
</head>
<body>

<div class="container">
    <h2>Product Filter</h2>

    <input type="text" placeholder="Search products..." id="search">

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Sample Product</td>
                <td><button class="edit-btn">Edit</button></td>
                <td><button class="delete-btn">Delete</button></td>
            </tr>
        </tbody>
    </table>
</div>

<script src="productfilt.js"></script>

</body>
</html>
