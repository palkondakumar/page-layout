<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      #studenttable{
        width: 50%;
      }


    </style>
</head>
<body>
<table border="1" id="studenttable">
  
  <tr>
    <th>name </th> 
    <th>age</th>
    <th>salary</th>
  </tr>
</table>
  
    <script>



   const studs=[
{
      name:"kumar",
      age:24,
      salary:20000,

},

{
      name:"ravi",
      age:25,
      salary:25000,

},
         ]


         let  table=document.getElementById("studenttable")

         for(i=0; i<studs.length; i++)
         {
              let row=document.createElement("tr")

              row.innerHTML=`<td>${studs[i].name}</td>
                         <td>${studs[i].age}</td>
                         <td>${studs[i].salary}</td>`

                      table.append(row) ;  

         }








    </script>
</body>
</html>
