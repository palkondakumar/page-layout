<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration</h2>

        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" > 

            <label>Email</label>
            <input type="email" placeholder="Enter your email" > 

            <label>Password</label>
            <input type="password" placeholder="Enter password" > 

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password" >  

            <button type="submit">Register</button>
        </form>

    </div>

</body>

</html>
