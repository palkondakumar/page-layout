<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>helloworld</h1>
    <button onclick="handleHtmlContent()">click</button>



    <script>
         
        function handleHtmlContent() {
            document.querySelector("h1").innerHTML = "welcome to dom topic";
            document.querySelector("h1").style.background = "blue";
            document.querySelector("h1").style.color = "orange";

        }
    </script>
</body>

</html>
